services:

  city_move:
    build: ./city_move/sources
    container_name: city_move
    ports:
      - "${CITYMOVE_DB_PORT}:5432"
      - "${CITYMOVE_API_PORT}:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${CITYMOVE_DB}
    volumes:
      - ./city_move/data:/var/lib/postgresql
    networks:
      - smart-city-network

  bikeshare:
    build: ./bike_share/sources
    container_name: bikeshare
    ports:
      - "${BIKESHARE_DB_PORT}:5432"
      - "${BIKESHARE_API_PORT}:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${BIKESHARE_DB}
    volumes:
      - ./bike_share/data:/var/lib/postgresql
    networks:
      - smart-city-network

  #airsense:
  #  build: ./airsense/sources
  #  container_name: airsense
  #  ports:
  #    - "${AIRSENSE_DB_PORT}:5432"
  #    - "${AIRSENSE_API_PORT}:8000"
  #  environment:
  #    POSTGRES_USER: ${POSTGRES_USER}
  #    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #    POSTGRES_DB: ${AIRSENSE_DB}
  #  volumes:
  #    - ./airsense/data:/var/lib/postgresql
  #  networks:
  #    - smart-city-network

  cityevents:
    build: ./city_events/sources
    container_name: cityevents
    ports:
      - "${CITYEVENTS_DB_PORT}:5432"
      - "${CITYEVENTS_API_PORT}:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${CITYEVENTS_DB}
    volumes:
      - ./city_events/data:/var/lib/postgresql
    networks:
      - smart-city-network

  dwh:
    image: postgres:16
    container_name: smart-city-dwh
    ports:
      - "${DWH_PORT}:5432"
    environment:
      POSTGRES_USER: ${DWH_USER}
      POSTGRES_PASSWORD: ${DWH_PASSWORD}
      POSTGRES_DB: ${DWH_DB}
    volumes:
      - ./data/dwh:/var/lib/postgresql/data
      - ./sql/dwh:/docker-entrypoint-initdb.d
    networks:
      - smart-city-network

  machine_learning:
    build:
      context: ./machine_learning/sources
      dockerfile: Dockerfile
    container_name: machine_learning
    working_dir: /workspace
    env_file:
      - .env
    environment:
      DB_HOST: ${ML_DB_HOST:-dwh}
      DB_PORT: ${ML_DB_PORT:-5432}
      DB_NAME: ${ML_DB_NAME:-dwh}
      DB_USER: ${ML_DB_USER}
      DB_PASSWORD: ${ML_DB_PASSWORD}
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
    ports:
      - "8888:8888"
    volumes:
      - ./machine_learning/sources/entrypoint.sh:/workspace-entrypoint.sh:ro
      - ./machine_learning/sources/jupyter_server_config.py:/workspace/jupyter_server_config.py:ro
      - ./machine_learning/notebooks:/workspace/notebooks
      - ./machine_learning/src:/workspace/src
      - ./machine_learning/models:/workspace/models
      - ./machine_learning/exports:/workspace/exports
    entrypoint: ["/bin/sh", "/workspace-entrypoint.sh"]
    command:
      - jupyter
      - lab
      - --config=/workspace/jupyter_server_config.py
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --ServerApp.allow_remote_access=False
      - --ServerApp.token=${JUPYTER_TOKEN}
      - --ServerApp.allow_origin=http://localhost:7909
      - --allow-root
    networks:
      - smart-city-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "MeinSicheresPasswort123!"

  airsense_nosql:
    build: ./airsense_nosql/sources
    container_name: airsense_nosql
    restart: unless-stopped
    ports:
      - "${AIRSENSE_API_PORT}:8000"
    environment:
      MONGO_URI: mongodb://127.0.0.1:27017
      MONGO_DATABASE: airsense
    volumes:
      - ./airsense_nosql/data:/data/db  

    networks:
      - smart-city-network


networks:
  smart-city-network:
    driver: bridge
  
